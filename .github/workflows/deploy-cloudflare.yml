name: Release Better Yield
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: better-yield-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/cloudflare.yml
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the confirmed live backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://vbmnnouwmxcuibywdkjw.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MAGPET_PUBLISHABLE_KEY }}
        run: npm run build:cloudflare
      - name: Deploy the current verified main commit and check the live result
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7f2cf5b5c6cd82599ac2317cf7b7968
          MAGPET_DATABASE_MIGRATION: ${{ vars.MAGPET_DATABASE_MIGRATION }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-cloudflare.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: production-release-evidence
          path: |
            cloudflare-output/build-report.json
            cloudflare-output/deployment-result.json
          retention-days: 30
