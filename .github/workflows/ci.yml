name: Verify AgriStore
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run build
      - name: Install test browser
        run: bash scripts/install-test-browser.sh
        timeout-minutes: 6
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: browser-test-results
          retention-days: 3
          path: |
            playwright-report/
            test-results/
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db lint --local --level warning
      - run: npm run test:db
      - run: npm run test:restore
      - name: Install test browser
        run: bash scripts/install-test-browser.sh
        timeout-minutes: 6
      - run: npm run test:integration
      - name: Save synthetic product-setup review captures
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: product-setup-review
          path: test-results/product-setup-*.png
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-failure-screenshots
          path: test-results/**/*.png
          retention-days: 3
        continue-on-error: true
      - run: npx supabase stop --no-backup
        if: always()
